];
const LEVELS=["7-8","5-6","3-4","1-2","0"];
const BAND_INFO={
"7-8":"Highest achievement band: the work demonstrates the criterion strongly, consistently and with depth, accuracy and/or sophistication appropriate to the task.",
"5-6":"Strong achievement band: the work demonstrates the criterion substantially and competently, with generally consistent application of the required skills.",
"3-4":"Developing achievement band: the main requirements of the criterion are demonstrated adequately, although consistency, detail or precision may still be developing.",
"1-2":"Beginning achievement band: only limited aspects of the criterion are demonstrated, with basic, partial or inconsistent evidence.",
"0":"The work does not demonstrate the standard described by the criterion at a measurable achievement level."
};
let currentYear="MYP 1",surveySubjects=[],currentUser=null;

function normalize(v){return String(v||"").toLowerCase().replace(/&/g,"and").replace(/[–—]/g,"-").replace(/[^a-z0-9 -]/g," ").replace(/\s+/g," ").trim()}
function resolveYear(v){const x=normalize(v);if(x.includes("myp 1")||x==="myp1")return"MYP 1";if(x.includes("myp 2")||x.includes("myp 3")||x==="myp2"||x==="myp3")return"MYP 2-3";if(x.includes("myp 4")||x.includes("myp 5")||x==="myp4"||x==="myp5")return"MYP 4-5";return null}
function categoryForSubject(subject){
 const x=normalize(subject);
 if(x.includes("language acquisition"))return"Language Acquisition";
 if(x.includes("language and literature"))return"English Language and Literature";
 if(["german","french","spanish","chinese","korean","hindi","urdu","arabic","portuguese","dutch","kiswahili","english"].some(l=>x===l||x.startsWith(l+" ")) && !x.includes("literature"))return"Language Acquisition";
 if(x.includes("integrated humanities")||x.includes("history")||x.includes("geography")||x.includes("economics"))return"Individual and Societies";
 if(x.includes("integrated sciences")||x.includes("biology")||x.includes("chemistry")||x.includes("physics")||x==="science")return"Sciences";
 if(x.includes("mathematics")||x.includes("maths"))return"Mathematics";
 if(x.includes("dance")||x.includes("music")||x.includes("theatre")||x.includes("drama")||x.includes("media arts")||x.includes("visual arts"))return"Arts";
 if(x.includes("physical and health education")||x.includes("physical education")||x.includes("phe"))return"Physical and Health Education";
 if(x==="design"||x.includes("design"))return"Design";
 return null;
}
function getDataCategory(name){return RUBRIC_DATA[currentYear]?.[name]||[]}
function renderLanding(){
 document.getElementById("landingView").style.display="block";document.getElementById("rubricView").style.display="none";
 document.querySelectorAll(".year-btn").forEach(b=>b.classList.toggle("active",b.dataset.year===currentYear));
 const container=document.getElementById("subjectContent");container.innerHTML="";
 const matched=new Map();
 surveySubjects.forEach(s=>{const c=categoryForSubject(s);if(c){if(!matched.has(c))matched.set(c,[]);if(!matched.get(c).includes(s))matched.get(c).push(s)}});
 for(const cat of CATEGORIES){const names=matched.get(cat.name)||[];if(!names.length)continue;const section=document.createElement("section");section.className="category";const h=document.createElement("h2");h.className="category-title";h.textContent=cat.display||cat.name;section.appendChild(h);const grid=document.createElement("div");grid.className="subject-grid";names.forEach(name=>grid.appendChild(makeCard(cat,name)));section.appendChild(grid);container.appendChild(section)}
 if(!surveySubjects.length){container.innerHTML='<div class="empty"><strong>Your survey subjects have not loaded.</strong><br>Complete the survey first, or use the MYP year buttons after signing in.</div>';return}
 if(!container.children.length){container.innerHTML='<div class="empty"><strong>No matching rubric subjects found.</strong><br>The subject names saved by the survey do not yet match a rubric category.</div>'}
}
function makeCard(cat,name){const b=document.createElement("button");b.type="button";b.className="subject-card";b.style.background=cat.color;const label=document.createElement("span");label.className="subject-name";label.textContent=name;b.appendChild(label);for(let i=0;i<6;i++){const s=document.createElement("span");s.className="symbol";s.textContent=cat.symbol;s.style.left=(8+(i*13)%78)+"%";s.style.top=(8+(i*17)%72)+"%";s.style.fontSize=(.9+(i%3)*.25)+"rem";s.style.animationDelay=(-i*.7)+"s";b.appendChild(s)}b.addEventListener("click",()=>openRubric(cat.name,name));return b}
function openRubric(category,subject){const criteria=getDataCategory(category);document.getElementById("landingView").style.display="none";document.getElementById("rubricView").style.display="block";document.getElementById("rubricTitle").textContent=subject;document.getElementById("rubricSubtitle").textContent=currentYear+" • "+(CATEGORIES.find(c=>c.name===category)?.display||category);const nav=document.getElementById("criteriaNav");nav.innerHTML="";const letters=[...new Set(criteria.map(c=>c.letter))];letters.forEach((letter,i)=>{const b=document.createElement("button");b.type="button";b.className="criterion-btn";b.textContent="Criterion "+letter;b.onclick=()=>renderCriterion(criteria,letter);nav.appendChild(b)});if(criteria.length)renderCriterion(criteria,letters[0]);else document.getElementById("criteriaContent").innerHTML='<div class="empty">No rubric content was found for this subject and MYP level.</div>';window.scrollTo({top:0,behavior:"smooth"})}
function renderCriterion(criteria,letter){document.querySelectorAll(".criterion-btn").forEach(b=>b.classList.toggle("active",b.textContent==="Criterion "+letter));const area=document.getElementById("criteriaContent");area.innerHTML="";criteria.filter(c=>c.letter===letter).forEach(c=>{const panel=document.createElement("article");panel.className="criterion-panel";const h=document.createElement("h2");h.textContent=`Criterion ${c.letter}: ${c.title}`;panel.appendChild(h);const max=document.createElement("div");max.className="maximum";max.textContent="Maximum: 8";panel.appendChild(max);if(c.phase){const p=document.createElement("div");p.className="phase-pill";p.textContent=c.phase;panel.appendChild(p)}if(c.aims?.length){const box=document.createElement("div");box.className="aims";box.innerHTML="<h3>What this criterion assesses</h3>";const ol=document.createElement("ol");c.aims.forEach(a=>{const li=document.createElement("li");li.textContent=a;ol.appendChild(li)});box.appendChild(ol);panel.appendChild(box)}const table=document.createElement("table");table.className="rubric-table";table.innerHTML="<thead><tr><th>Achievement level</th><th>What the level means</th></tr></thead>";const body=document.createElement("tbody");LEVELS.forEach(level=>{const tr=document.createElement("tr"),td1=document.createElement("td"),td2=document.createElement("td");td1.className="band";td1.textContent=level;td2.textContent=BAND_INFO[level];const focus=document.createElement("div");focus.className="focus";focus.textContent=level==="7-8"?"Use the criterion aims above as your checklist for demonstrating the highest level.":level==="5-6"?"Aim to address the criterion aims substantially and consistently.":level==="3-4"?"Aim to cover the main criterion aims clearly and with developing consistency.":level==="1-2"?"Start by addressing the basic parts of the criterion and build consistency.":"No demonstrated achievement standard.";td2.appendChild(focus);tr.append(td1,td2);body.appendChild(tr)});table.appendChild(body);panel.appendChild(table);area.appendChild(panel)})}
document.getElementById("homeBtn").onclick=()=>location.href="./index.html";document.getElementById("dashboardBtn").onclick=()=>location.href="./dashboard.html";document.getElementById("backBtn").onclick=()=>{renderLanding();window.scrollTo({top:0,behavior:"smooth"})};document.querySelectorAll(".year-btn").forEach(b=>b.onclick=()=>{currentYear=b.dataset.year;renderLanding()});
onAuthStateChanged(auth,async user=>{if(!user){location.href="./account.html";return}currentUser=user;try{const snap=await getDoc(doc(db,"users",user.uid));if(snap.exists()){const d=snap.data();surveySubjects=Array.isArray(d.subjects)?d.subjects:[];const y=resolveYear(d.mypYear);if(y)currentYear=y}}catch(e){console.error(e);surveySubjects=[]}renderLanding()});

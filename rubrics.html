<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rubrics | MYP Haven</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
    margin:0;
    background:#FAF8F6;
    color:#202333;
    font-family:"DM Sans",sans-serif;
}
button{font:inherit}
button:focus-visible{outline:4px solid rgba(32,35,51,.18);outline-offset:3px}

.page{
    min-height:100vh;
    padding:34px 5vw 90px;
}

.topbar{
    width:min(1450px,100%);
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.nav-btn{
    border:0;
    background:#fff;
    color:#202333;
    padding:13px 20px;
    border-radius:999px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 28px rgba(32,35,51,.08);
    transition:.25s ease;
}
.nav-btn:hover{transform:translateY(-3px);box-shadow:0 13px 32px rgba(32,35,51,.12)}

.hero{
    min-height:350px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    overflow:hidden;
}

.hero h1{
    font-family:"Bricolage Grotesque",sans-serif;
    font-size:clamp(5rem,12vw,11rem);
    line-height:.9;
    margin:35px 0 55px;
    letter-spacing:-.065em;
    font-weight:800;
    opacity:0;
    filter:blur(13px);
    transform:translateY(70px);
    animation:heroIn 1.35s cubic-bezier(.2,.8,.2,1) .1s forwards;
}
@keyframes heroIn{
    to{opacity:1;filter:blur(0);transform:translateY(0)}
}

.criteria-float{
    position:absolute;
    width:76px;
    height:76px;
    border-radius:20px;
    display:grid;
    place-items:center;
    font-family:"Bricolage Grotesque",sans-serif;
    font-size:1.7rem;
    font-weight:800;
    opacity:0;
    transform:scale(.55);
    animation:criterionIn .75s cubic-bezier(.2,1.35,.3,1) forwards;
}
.criteria-float:nth-of-type(1){background:#F9C6D0;top:25px;left:calc(50% - 255px);animation-delay:.65s}
.criteria-float:nth-of-type(2){background:#B8DDF2;top:95px;right:calc(50% - 300px);animation-delay:.82s}
.criteria-float:nth-of-type(3){background:#FDE3A7;bottom:20px;left:calc(50% - 300px);animation-delay:.99s}
.criteria-float:nth-of-type(4){background:#C8B9E8;bottom:50px;right:calc(50% - 255px);animation-delay:1.16s}
@keyframes criterionIn{
    0%{opacity:0;transform:scale(.55)}
    70%{opacity:1;transform:scale(1.08)}
    100%{opacity:1;transform:scale(1)}
}

.selector-wrap{
    width:min(1250px,100%);
    margin:15px auto 50px;
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
}
.year-btn{
    border:0;
    padding:14px 28px;
    border-radius:999px;
    background:#fff;
    color:#202333;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 7px 25px rgba(32,35,51,.07);
    transition:.25s ease;
}
.year-btn:hover{transform:translateY(-2px)}
.year-btn.active{background:#202333;color:#fff}

.content{
    width:min(1450px,100%);
    margin:0 auto;
}
.category{
    margin:0 0 42px;
}
.category-title{
    font-family:"Bricolage Grotesque",sans-serif;
    font-size:clamp(1.7rem,3vw,2.7rem);
    margin:0 0 18px;
    letter-spacing:-.035em;
}
.subject-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:18px;
}
.subject-card{
    position:relative;
    min-height:190px;
    border:0;
    border-radius:30px;
    padding:24px;
    overflow:hidden;
    cursor:pointer;
    text-align:left;
    display:flex;
    align-items:flex-end;
    transition:transform .3s ease,box-shadow .3s ease;
    box-shadow:0 10px 30px rgba(32,35,51,.06);
}
.subject-card:hover{
    transform:translateY(-7px) rotate(-.4deg);
    box-shadow:0 20px 45px rgba(32,35,51,.11);
}
.subject-name{
    position:relative;
    z-index:3;
    font-family:"Bricolage Grotesque",sans-serif;
    font-size:1.2rem;
    font-weight:800;
    line-height:1.05;
    max-width:92%;
}
.symbol{
    position:absolute;
    color:rgba(32,35,51,.16);
    font-weight:800;
    user-select:none;
    pointer-events:none;
    animation:float 5s ease-in-out infinite;
}
@keyframes float{
    0%,100%{transform:translateY(0) rotate(-5deg)}
    50%{transform:translateY(-13px) rotate(7deg)}
}

.empty{
    text-align:center;
    padding:55px 20px;
    background:#fff;
    border-radius:28px;
    color:#646878;
}
.empty strong{color:#202333}

#rubricView{
    display:none;
}
.rubric-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    margin-bottom:25px;
}
.rubric-title{
    font-family:"Bricolage Grotesque",sans-serif;
    font-size:clamp(2.3rem,5vw,4.8rem);
    line-height:.95;
    letter-spacing:-.05em;
    margin:0;
}
.rubric-subtitle{
    margin:10px 0 0;
    color:#666A79;
    font-weight:600;
}
.back-btn{
    border:0;
    background:#202333;
    color:#fff;
    padding:13px 20px;
    border-radius:999px;
    cursor:pointer;
    font-weight:800;
    white-space:nowrap;
}

.criteria-nav{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin:28px 0;
}
.criterion-btn{
    border:0;
    padding:11px 18px;
    border-radius:14px;
    cursor:pointer;
    font-weight:800;
    background:#fff;
}
.criterion-btn.active{background:#202333;color:#fff}

.criterion-panel{
    background:#fff;
    border-radius:30px;
    padding:clamp(22px,4vw,45px);
    box-shadow:0 12px 40px rgba(32,35,51,.07);
    margin-bottom:30px;
}
.criterion-panel h2{
    font-family:"Bricolage Grotesque",sans-serif;
    font-size:clamp(1.8rem,4vw,3.2rem);
    margin:0 0 8px;
}
.maximum{
    font-weight:800;
    color:#737787;
    margin-bottom:25px;
}
.aims{
    background:#FAF8F6;
    border-radius:20px;
    padding:20px 24px;
    margin-bottom:28px;
}
.aims h3,.level h3{
    font-family:"Bricolage Grotesque",sans-serif;
    margin:0 0 12px;
}
.aims ol{
    margin:0;
    padding-left:24px;
}
.levels{
    display:grid;
    gap:15px;
}
.level{
    border:1px solid #ececf0;
    border-radius:22px;
    overflow:hidden;
    background:#fff;
}
.level summary{
    list-style:none;
    cursor:pointer;
    padding:18px 20px;
    font-weight:800;
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:center;
}
.level summary::-webkit-details-marker{display:none}
.level summary::after{content:"+";font-size:1.5rem}
.level[open] summary::after{content:"−"}
.level-body{
    border-top:1px solid #ececf0;
    padding:20px;
    color:#3f4352;
    line-height:1.65;
}
.level-body ol{
    margin:0;
    padding-left:24px;
}
.level-body p{margin:0 0 10px}
.source-note{
    padding:15px 18px;
    border-radius:16px;
    background:#fff7d9;
    font-size:.9rem;
    font-weight:600;
    color:#5e5638;
    margin-top:25px;
}

.hidden{display:none!important}


.phase-pill{
    display:inline-flex;
    padding:9px 13px;
    border-radius:999px;
    background:#F1EEF5;
    color:#555967;
    font-size:.85rem;
    font-weight:800;
    margin-bottom:20px;
}
.band-label{
    font-size:.78rem;
    color:#777B89;
    font-weight:700;
}
.level-focus{
    margin-top:12px!important;
    padding-top:12px;
    border-top:1px solid #eeeeF2;
    color:#666A79;
    font-weight:600;
}

@media(max-width:700px){
    .page{padding:20px 16px 60px}
    .hero{min-height:310px}
    .hero h1{font-size:clamp(4rem,20vw,7rem);margin:30px 0}
    .criteria-float{width:58px;height:58px;border-radius:16px;font-size:1.3rem}
    .criteria-float:nth-of-type(1){left:8%;top:20px}
    .criteria-float:nth-of-type(2){right:8%;top:70px}
    .criteria-float:nth-of-type(3){left:10%;bottom:20px}
    .criteria-float:nth-of-type(4){right:10%;bottom:45px}
    .rubric-head{align-items:flex-start;flex-direction:column}
    .back-btn{width:100%}
}
</style>
</head>

</main>

/* ============================================================
   SURVEY CONNECTION
   The survey/dashboard system stores the selected subjects in:
   users/{uid}.subjects
   ============================================================ */

async function loadSurveyData(){
    if(!currentUser){
        return;
    }

    try{
        const snapshot=await getDoc(
            doc(db,"users",currentUser.uid)
        );

        if(snapshot.exists()){
            const data=snapshot.data();

            surveySubjects=Array.isArray(data.subjects)
                ? data.subjects
                : [];

            /*
              If your survey later stores the MYP year under any of
              these fields, Rubrics can automatically select the
              correct band. If no year is stored, the three buttons
              remain available.
            */
            const possibleYear=
                data.mypYear ??
                data.year ??
                data.grade ??
                data.level ??
                data.mypLevel ??
                "";

            const resolved=resolveYear(possibleYear);

            if(resolved){
                currentYear=resolved;
            }
        }else{
            surveySubjects=[];
        }

    }catch(error){
        console.error("Could not load survey data:",error);
        surveySubjects=[];
    }

    renderLanding();
}

function resolveYear(value){
    const v=String(value).toLowerCase().replace(/\s+/g," ");

    if(
        v.includes("myp 1") ||
        v==="myp1" ||
        v.includes("grade 6")
    ){
        return "MYP 1";
    }

    if(
        v.includes("myp 2") ||
        v.includes("myp 3") ||
        v==="myp2" ||
        v==="myp3" ||
        v.includes("grade 7") ||
        v.includes("grade 8")
    ){
        return "MYP 2-3";
    }

    if(
        v.includes("myp 4") ||
        v.includes("myp 5") ||
        v==="myp4" ||
        v==="myp5" ||
        v.includes("grade 9") ||
        v.includes("grade 10")
    ){
        return "MYP 4-5";
    }

    return null;
}

function normalizeSubject(value){
    return String(value)
        .toLowerCase()
        .replace(/&/g,"and")
        .replace(/[–—]/g,"-")
        .replace(/[^a-z0-9 -]/g," ")
        .replace(/\s+/g," ")
        .trim();
}

function categoryForSubject(subject){
    const value=normalizeSubject(subject);

    for(const category of CATEGORIES){
        if(
            category.matches.some(match=>{
                const m=normalizeSubject(match);
                return value===m || value.includes(m);
            })
        ){
            return category;
        }
    }

    return null;
}

function selectedSubjectsForCategory(category){
    return surveySubjects.filter(subject=>{
        const found=categoryForSubject(subject);
        return found && found.name===category.name;
    });
}

function renderLanding(){
    document.getElementById("landingView").style.display="block";
    document.getElementById("rubricView").style.display="none";

    document.querySelectorAll(".year-btn").forEach(btn=>{
        btn.classList.toggle("active",btn.dataset.year===currentYear);
    });

    const container=document.getElementById("subjectContent");
    container.innerHTML="";

    if(!surveySubjects.length){
        container.innerHTML=`
            <div class="empty">
                <strong>Your subjects have not been loaded yet.</strong><br>
                Complete your MYP Haven survey first. Your selected subjects will appear here automatically.
            </div>
        `;
        return;
    }

    let displayed=0;

    for(const category of CATEGORIES){
        const selected=selectedSubjectsForCategory(category);

        if(!selected.length) continue;

        const section=document.createElement("section");
        section.className="category";

        const title=document.createElement("h2");
        title.className="category-title";
        title.textContent=category.name;
        section.appendChild(title);

        const grid=document.createElement("div");
        grid.className="subject-grid";

        [...new Set(selected)].forEach(subject=>{
            const card=document.createElement("button");
            card.className="subject-card";
            card.style.background=category.color;
            card.type="button";

            const label=document.createElement("span");
            label.className="subject-name";
            label.textContent=subject;
            card.appendChild(label);

            for(let i=0;i<6;i++){
                const symbol=document.createElement("span");
                symbol.className="symbol";
                symbol.textContent=category.symbol;
                symbol.style.left=(8+Math.random()*78)+"%";
                symbol.style.top=(7+Math.random()*72)+"%";
                symbol.style.fontSize=(.9+Math.random()*1.2)+"rem";
                symbol.style.animationDelay=(-Math.random()*5)+"s";
                card.appendChild(symbol);
            }

            card.addEventListener("click",()=>{
                openRubric(category.name,subject);
            });

            grid.appendChild(card);
        });

        section.appendChild(grid);
        container.appendChild(section);
        displayed++;
    }

    if(currentYear==="MYP 4-5"){
        const pp=document.createElement("section");
        pp.className="category";
        pp.innerHTML='<h2 class="category-title">MYP 4–5 Only</h2>';

        const grid=document.createElement("div");
        grid.className="subject-grid";

        const card=document.createElement("button");
        card.className="subject-card";
        card.style.background="#F3C6A5";
        card.type="button";
        card.innerHTML='<span class="subject-name">Personal Project</span>';

        for(let i=0;i<6;i++){
            const symbol=document.createElement("span");
            symbol.className="symbol";
            symbol.textContent="↑";
            symbol.style.left=(8+Math.random()*78)+"%";
            symbol.style.top=(7+Math.random()*72)+"%";
            symbol.style.animationDelay=(-Math.random()*5)+"s";
            card.appendChild(symbol);
        }

        card.addEventListener("click",()=>{
            openPersonalProject();
        });

        grid.appendChild(card);
        pp.appendChild(grid);
        container.appendChild(pp);
    }

    if(!displayed){
        container.innerHTML=`
            <div class="empty">
                <strong>No rubric subject matches were found.</strong><br>
                Your survey is connected, but one of its subject names does not yet have a matching rubric category.
            </div>
        `;
    }
}

function getCriteria(categoryName){
    return RUBRIC_DATA[currentYear]?.[
        categoryName==="Individuals & Societies"
            ? "Individual and Societies"
            : categoryName
    ] || [];
}

function openRubric(categoryName,subjectName){
    currentSubject=categoryName;
    selectedCriterion=null;

    document.getElementById("landingView").style.display="none";
    document.getElementById("rubricView").style.display="block";

    document.getElementById("rubricTitle").textContent=subjectName;
    document.getElementById("rubricSubtitle").textContent=
        currentYear+" • "+categoryName;

    const criteria=getCriteria(categoryName);
    renderCriteriaNavigation(criteria);

    if(criteria.length){
        selectedCriterion=criteria[0].letter;
        renderCriterion(criteria,selectedCriterion);
    }else{
        document.getElementById("criteriaContent").innerHTML=
            '<div class="empty">The selected rubric could not be found in the supplied rubric document.</div>';
    }

    window.scrollTo({top:0,behavior:"smooth"});
}

    document.getElementById("landingView").style.display="none";

}

function renderCriteriaNavigation(criteria){
    const nav=document.getElementById("criteriaNav");
    nav.innerHTML="";

    [...new Set(criteria.map(c=>c.letter))].forEach(letter=>{
        const btn=document.createElement("button");
        btn.className="criterion-btn";
        btn.type="button";
        btn.textContent="Criterion "+letter;

        btn.addEventListener("click",()=>{
            selectedCriterion=letter;
            renderCriterion(criteria,letter);
        });

        nav.appendChild(btn);
    });
}

        LEVELS.forEach(level=>{
            const details=document.createElement("details");
            details.className="level";
            if(level==="7-8") details.open=true;

            const summary=document.createElement("summary");
            summary.innerHTML=`
                <span>Achievement level ${level}</span>
                <span class="band-label">${level==="7-8"?"Highest band":level==="0"?"No demonstrated standard":"Band"}</span>
            `;

            const body=document.createElement("div");
            body.className="level-body";

            const p=document.createElement("p");
            p.textContent=BAND_INFO[level];

            body.appendChild(p);

            if(criterion.aims.length){
                const focus=document.createElement("p");
                focus.className="level-focus";
                focus.textContent=
                    level==="7-8"
                    ? "At this level, aim to demonstrate the criterion aims consistently and with the level of depth expected for the highest band."
                    : level==="5-6"
                    ? "At this level, aim to address the criterion aims substantially and with increasing consistency."
                    : level==="3-4"
                    ? "At this level, aim to address the main criterion aims clearly and with developing consistency."
                    : level==="1-2"
                    ? "At this level, focus on addressing the basic parts of the criterion with support where needed."
                    : "No achievement-level standard is demonstrated.";
                body.appendChild(focus);
            }

            details.appendChild(summary);
            details.appendChild(body);
            levels.appendChild(details);
        });

        panel.appendChild(levels);
        content.appendChild(panel);
    });
}

function escapeHtml(value){
    const div=document.createElement("div");
    div.textContent=value;
    return div.innerHTML;
}

/* ============================================================
   LANDING PAGE
   ============================================================ */

function renderLanding(){
    document.getElementById("landingView").style.display="block";
    document.getElementById("rubricView").style.display="none";

    document.querySelectorAll(".year-btn").forEach(btn=>{
        btn.classList.toggle("active",btn.dataset.year===currentYear);
    });

    const selected=surveySelectedSubjects();
    const container=document.getElementById("subjectContent");
    container.innerHTML="";

    let displayed=0;

    for(const category of CATEGORIES){
        let names=selected[category.name];

        /*
          If no survey information can be found, show the full category
          so the rubric page remains usable instead of appearing broken.
        */
        if(!names || !names.length){
            names=getDefaultSubjects(category.name);
        }

        if(!names.length) continue;

        const section=document.createElement("section");
        section.className="category";

        const title=document.createElement("h2");
        title.className="category-title";
        title.textContent=category.name;
        section.appendChild(title);

        const grid=document.createElement("div");
        grid.className="subject-grid";

        names.forEach(name=>{
            const card=document.createElement("button");
            card.className="subject-card";
            card.style.background=category.color;
            card.type="button";

            const label=document.createElement("span");
            label.className="subject-name";
            label.textContent=name;

            card.appendChild(label);

            for(let i=0;i<6;i++){
                const symbol=document.createElement("span");
                symbol.className="symbol";
                symbol.textContent=category.symbol;
                symbol.style.left=(8+Math.random()*78)+"%";
                symbol.style.top=(7+Math.random()*72)+"%";
                symbol.style.fontSize=(.9+Math.random()*1.2)+"rem";
                symbol.style.animationDelay=(-Math.random()*5)+"s";
                grid.appendChild(card);
                card.appendChild(symbol);
            }

            /*
              For MYP4–5, Personal Project is an additional rubric.
            */
            card.addEventListener("click",()=>openRubric(category.name,name));
        });

        section.appendChild(grid);
        container.appendChild(section);
        displayed++;
    }

    if(currentYear==="MYP 4-5"){
        const pp=document.createElement("section");
        pp.className="category";
        pp.innerHTML='<h2 class="category-title">MYP 4–5 Only</h2>';

        const grid=document.createElement("div");
        grid.className="subject-grid";

        const card=document.createElement("button");
        card.className="subject-card";
        card.style.background="#F3C6A5";
        card.type="button";
        card.innerHTML='<span class="subject-name">Personal Project</span>';

        for(let i=0;i<6;i++){
            const s=document.createElement("span");
            s.className="symbol";
            s.textContent="🚀";
            s.style.left=(8+Math.random()*78)+"%";
            s.style.top=(7+Math.random()*72)+"%";
            s.style.animationDelay=(-Math.random()*5)+"s";
            grid.appendChild(card);
            card.appendChild(s);
        }

        card.addEventListener("click",()=>openRubric("Personal Project","Personal Project"));
        pp.appendChild(grid);
        container.appendChild(pp);
    }

    if(!displayed){
        container.innerHTML='<div class="empty"><strong>No subjects found.</strong><br>Choose subjects in your survey or use the subject cards when available.</div>';
    }
}

function getDefaultSubjects(category){
    const defaults={
        "English Language and Literature":["English Language and Literature"],
        "Language Acquisition":["German","French","Spanish","Chinese","Korean","Hindi","Urdu","Kiswahili"],
        "Individuals & Societies":["Geography","History","Economics","Integrated Humanities"],
        "Sciences":["Biology","Chemistry","Physics","Integrated Sciences"],
        "Mathematics":["Mathematics"],
        "Arts":["Visual Arts","Drama","Music","Dance"],
        "Physical & Health Education":["Physical & Health Education"],
        "Design":["Design"]
    };
    return defaults[category] || [];
}

/* ============================================================
   RUBRIC VIEW
   ============================================================ */

function openRubric(categoryName,subjectName){
    currentSubject=categoryName;
    selectedCriterion=null;

    document.getElementById("landingView").style.display="none";
    document.getElementById("rubricView").style.display="block";

    document.getElementById("rubricTitle").textContent=subjectName;
    document.getElementById("rubricSubtitle").textContent=
        currentYear + " • " + categoryName;

    let criteria=[];

    if(subjectName==="Personal Project"){
        // Personal Project is stored under the Design/MYP4-5 source area
        // when the supplied document includes it as an MYP4-5-only section.
        criteria=findPersonalProjectCriteria();
    }else{
        criteria=parsedRubrics[currentYear][categoryName] || [];
    }

    const nav=document.getElementById("criteriaNav");
    nav.innerHTML="";

    const content=document.getElementById("criteriaContent");
    content.innerHTML="";

    if(!criteria.length){
        content.innerHTML='<div class="empty">No rubric criteria were found for this selection in the supplied source document.</div>';
        window.scrollTo({top:0,behavior:"smooth"});
        return;
    }

    const letters=[...new Set(criteria.map(c=>c.letter))];

    letters.forEach((letter,index)=>{
        const btn=document.createElement("button");
        btn.className="criterion-btn";
        btn.textContent="Criterion "+letter;
        btn.type="button";
        btn.addEventListener("click",()=>{
            selectedCriterion=letter;
            renderCriterion(criteria,letter);
        });
        nav.appendChild(btn);

        if(index===0) selectedCriterion=letter;
    });

    renderCriterion(criteria,selectedCriterion);
    window.scrollTo({top:0,behavior:"smooth"});
}

function renderCriterion(criteria,letter){
    document.querySelectorAll(".criterion-btn").forEach(btn=>{
        btn.classList.toggle("active",btn.textContent==="Criterion "+letter);
    });

    const matching=criteria.filter(c=>c.letter===letter);
    const content=document.getElementById("criteriaContent");
    content.innerHTML="";

    matching.forEach((criterion,index)=>{
        const panel=document.createElement("article");
        panel.className="criterion-panel";

        const heading=document.createElement("h2");
        heading.textContent=`Criterion ${criterion.letter}: ${criterion.title}`;
        panel.appendChild(heading);

        const maximum=document.createElement("div");
        maximum.className="maximum";
        maximum.textContent=`Maximum: ${criterion.maximum}`;
        panel.appendChild(maximum);

        if(criterion.aims.length){
            const aims=document.createElement("div");
            aims.className="aims";
            aims.innerHTML="<h3>At the end of the year, you should be able to:</h3>";

            const ol=document.createElement("ol");
            criterion.aims.forEach(item=>{
                const li=document.createElement("li");
                li.textContent=item.replace(/^(i|ii|iii|iv|v|vi|vii|viii)\.\s*/i,"");
                ol.appendChild(li);
            });
            aims.appendChild(ol);
            panel.appendChild(aims);
        }

        const levels=document.createElement("div");
        levels.className="levels";

        for(const level of LEVELS){
            if(!criterion.levels[level]) continue;

            const details=document.createElement("details");
            details.className="level";
            if(level==="7-8") details.open=true;

            const summary=document.createElement("summary");
            summary.textContent=`Achievement level ${level}`;

            const body=document.createElement("div");
            body.className="level-body";
            body.appendChild(formatDescriptor(criterion.levels[level]));

            details.appendChild(summary);
            details.appendChild(body);
            levels.appendChild(details);
        }

        panel.appendChild(levels);

        if(index===0 && matching.length>1){
            const note=document.createElement("div");
            note.className="source-note";
            note.textContent="This criterion appears more than once in the supplied source because the source contains phase-specific descriptors. The original distinctions have been retained.";
            panel.appendChild(note);
        }

        content.appendChild(panel);
    });
}

function formatDescriptor(text){
    const wrapper=document.createElement("div");
    const items=splitNumberedItems(text);

    if(items.length){
        const ol=document.createElement("ol");
        items.forEach(item=>{
            const li=document.createElement("li");
            li.textContent=item.replace(/^(i|ii|iii|iv|v|vi|vii|viii)\.\s*/i,"");
            ol.appendChild(li);
        });
        wrapper.appendChild(ol);
    }else{
        const p=document.createElement("p");
        p.textContent=text;
        wrapper.appendChild(p);
    }

    return wrapper;
}

/* Personal Project is located in the MYP4-5 portion of the supplied source.
   This finder intentionally searches the original source rather than
   inventing criteria when the heading exists. */
function findPersonalProjectCriteria(){
    const start=RUBRIC_SOURCE.indexOf("Personal Project");
    if(start<0) return [];
    const section=RUBRIC_SOURCE.slice(start);
    return extractCriteria(section);
}

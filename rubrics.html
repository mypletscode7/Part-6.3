<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rubrics | MYP Haven</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            background: #FAF8F6;
            color: #202333;

            font-family: "DM Sans", sans-serif;
        }

        .page {
            width: min(900px, 100%);
            text-align: center;
        }

        .icon {
            width: 90px;
            height: 90px;

            margin: 0 auto 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 28px;

            background: #BFC9FF;

            font-size: 2.8rem;

            box-shadow:
                0 15px 40px rgba(32, 35, 51, 0.08);
        }

        h1 {
            margin-bottom: 18px;

            font-family: "Bricolage Grotesque", sans-serif;

            font-size: clamp(3.5rem, 8vw, 7rem);

            line-height: 0.95;

            letter-spacing: -0.055em;

            font-weight: 800;
        }

        p {
            max-width: 600px;

            margin: 0 auto;

            color: #62677A;

            font-size: 1.15rem;

            line-height: 1.6;
        }

        .back-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            margin-top: 35px;

            min-width: 190px;
            height: 54px;

            padding: 0 28px;

            border: none;
            border-radius: 999px;

            background: #202333;
            color: #FFFFFF;

            font-family: "DM Sans", sans-serif;

            font-size: 0.95rem;
            font-weight: 700;

            text-decoration: none;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .back-button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 30px rgba(32, 35, 51, 0.18);
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 4rem;
            }

            p {
                font-size: 1rem;
            }

        }

    </style>
</head>

<body>

    <main class="page">

        <div class="icon">
            📋
        </div>

        <h1>
            Still in Development
        </h1>

        <p>
            The Rubrics section is currently being developed.
            Check back later for a complete collection of MYP rubrics and assessment support.
        </p>

        <a
            href="dashboard.html"
            class="back-button"
        >
            Back to Dashboard
        </a>

    </main>

</body>

</html>

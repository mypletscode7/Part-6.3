<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Command-Term Database | MYP Haven</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: #FAFAFC;
            color: #202333;
            font-family: "DM Sans", sans-serif;
            overflow-x: hidden;
        }

        /* =========================
           PAGE
        ========================= */

        .page {
            width: min(1200px, calc(100% - 48px));
            margin: 0 auto;
            padding: 70px 0 80px;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            margin-bottom: 48px;
            animation: headerIn 0.8s ease both;
        }

        .header h1 {
            font-family: "Bricolage Grotesque", sans-serif;
            font-size: clamp(42px, 6vw, 72px);
            line-height: 0.98;
            font-weight: 800;
            letter-spacing: -2.5px;
            color: #202333;
            margin-bottom: 16px;
        }

        .header-intro {
            font-family: "DM Sans", sans-serif;
            font-size: 19px;
            line-height: 1.6;
            font-weight: 600;
            color: #202333;
            max-width: 750px;
            margin-bottom: 22px;
        }

        .header-subtext {
            font-family: "DM Sans", sans-serif;
            font-size: 17px;
            line-height: 1.65;
            font-weight: 400;
            color: rgba(32, 35, 51, 0.72);
            max-width: 800px;
        }

        /* =========================
           COMMAND TERM GRID
        ========================= */

        .command-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        /* =========================
           COMMAND CARD
        ========================= */

        .command-card {
            position: relative;
            overflow: hidden;

            min-height: 145px;
            padding: 28px 30px;

            border-radius: 25px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            transition:
                transform 0.28s ease,
                box-shadow 0.28s ease;

            animation: cardIn 0.6s ease both;
        }

        .command-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 38px rgba(32, 35, 51, 0.10);
        }

        .command-number {
            position: absolute;
            top: 17px;
            right: 20px;

            font-family: "DM Sans", sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: rgba(32, 35, 51, 0.42);
        }

        .command-term {
            font-family: "Bricolage Grotesque", sans-serif;
            font-size: 25px;
            line-height: 1.1;
            font-weight: 800;
            color: #202333;

            margin-bottom: 10px;
            padding-right: 35px;
        }

        .command-definition {
            font-family: "DM Sans", sans-serif;
            font-size: 15px;
            line-height: 1.55;
            font-weight: 600;
            color: rgba(32, 35, 51, 0.76);

            max-width: 850px;
        }

        /* =========================
           BACK BUTTON
        ========================= */

        .bottom-navigation {
            display: flex;
            justify-content: center;
            margin-top: 55px;
        }

        .back-button {
            border: none;
            outline: none;
            cursor: pointer;

            padding: 16px 28px;
            border-radius: 999px;

            background: #202333;
            color: white;

            font-family: "DM Sans", sans-serif;
            font-size: 15px;
            font-weight: 700;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .back-button:hover {
            transform: translateY(-3px);
            background: #202333;
            box-shadow: 0 12px 25px rgba(32, 35, 51, 0.18);
        }

        .back-button:active {
            transform: translateY(0);
            background: #202333;
            box-shadow: 0 6px 14px rgba(32, 35, 51, 0.12);
        }

        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes headerIn {
            from {
                opacity: 0;
                transform: translateY(24px);
                filter: blur(7px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 800px) {
            .page {
                width: min(100% - 30px, 650px);
                padding-top: 45px;
            }

            .command-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                letter-spacing: -1.5px;
            }

            .header-intro {
                font-size: 18px;
            }

            .header-subtext {
                font-size: 16px;
            }

            .command-card {
                min-height: auto;
            }
        }

        @media (max-width: 500px) {
            .page {
                width: calc(100% - 22px);
                padding-top: 35px;
                padding-bottom: 50px;
            }

            .header {
                margin-bottom: 32px;
            }

            .header h1 {
                font-size: 42px;
            }

            .header-intro {
                font-size: 16px;
                margin-bottom: 18px;
            }

            .header-subtext {
                font-size: 15px;
            }

            .command-card {
                padding: 25px 23px;
                border-radius: 21px;
            }

            .command-term {
                font-size: 22px;
            }

            .command-definition {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <!-- =========================
             HEADER
        ========================== -->

        <header class="header">

            <h1>Command-Term Database</h1>

            <p class="header-intro">
                Find every command term needed for success.
            </p>

            <p class="header-subtext">
                When using the rubrics, the words in bold are called the command terms.
                This section is here to provide every single command term which you can
                use to understand what your work needs to achieve.
            </p>

        </header>


        <!-- =========================
             COMMAND TERMS
        ========================== -->

        <section class="command-grid" id="commandGrid"></section>


        <!-- =========================
             NAVIGATION
        ========================== -->

        <div class="bottom-navigation">

            <button
                class="back-button"
                onclick="goToDashboard()"
            >
                Back to Dashboard
            </button>

        </div>

    </main>


    <script>

        /* ==========================================
           CREATE COMMAND CARDS
        ========================================== */

        const grid = document.getElementById("commandGrid");

        commandTerms.forEach((command, index) => {

            const card = document.createElement("article");

            card.className = "command-card";

            card.style.backgroundColor = command.color;

            card.style.animationDelay = `${index * 0.025}s`;

            card.innerHTML = `
                <span class="command-number">
                    ${index + 1}
                </span>

                <h2 class="command-term">
                    ${command.term}
                </h2>

                <p class="command-definition">
                    ${command.definition}
                </p>
            `;

            grid.appendChild(card);

        });


        /* ==========================================
           DASHBOARD NAVIGATION
        ========================================== */

        function goToDashboard() {
            window.location.href = "./dashboard.html";
        }

    </script>

</html>

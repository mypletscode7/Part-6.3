<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MYP Haven — Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:"DM Sans",sans-serif;
    background:#A855F7;
    color:#171717;
    overflow-x:hidden;
}

button,
input,
textarea,
select{
    font:inherit;
}


/* =========================================================
   LOCK-IN SCREEN
========================================================= */

.lock-screen{
    min-height:100vh;
    width:100%;
    padding:35px 18px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    transition:
        opacity .9s ease,
        transform .9s ease,
        visibility .9s ease;
}

.lock-screen.hidden{
    opacity:0;
    transform:translateY(-35px) scale(.98);
    visibility:hidden;
    pointer-events:none;
    position:absolute;
}

.current-date{
    color:#D946EF;
    font-size:18px;
    font-weight:700;
    text-align:center;
    margin-bottom:8px;
}

.welcome-title{
    color:white;
    font-family:"Bricolage Grotesque",sans-serif;
    font-size:clamp(3.5rem,8vw,7rem);
    font-weight:800;
    letter-spacing:-.055em;
    line-height:.95;
    text-align:center;
    margin-bottom:45px;
}

.lock-slider{
    width:calc(100vw - 36px);
    max-width:1700px;
    height:125px;
    border-radius:100px;
    background:#eeeeee;
    position:relative;
    overflow:hidden;
    user-select:none;
    touch-action:none;

    box-shadow:
        inset 0 1px 2px rgba(0,0,0,.04),
        0 12px 40px rgba(0,0,0,.10);
}

.lock-progress{
    position:absolute;
    inset:0 auto 0 0;
    width:0%;
    border-radius:100px;

    background:
        linear-gradient(
            90deg,
            #FF4D6D 0%,
            #FF8A3D 5.88%,
            #FFD23F 11.76%,
            #7ED957 17.64%,
            #39D6C0 23.52%,
            #34D399 29.40%,
            #00C2FF 35.28%,
            #3B82F6 41.16%,
            #8B5CF6 47.04%,
            #A855F7 52.92%,
            #FF6FB5 58.80%,
            #D946EF 64.68%,
            #C026D3 70.56%,
            #A21CAF 76.44%,
            #86198F 82.32%,
            #6366F1 88.20%,
            #818CF8 94.10%,
            #22D3EE 100%
        );

    transition:width .04s linear;
}

.lock-text{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:clamp(1.2rem,2.5vw,2rem);
    font-weight:700;
    pointer-events:none;
    z-index:5;
}

.cap-handle{
    width:108px;
    height:108px;
    border-radius:50%;
    background:white;
    position:absolute;
    left:8px;
    top:8.5px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:55px;
    cursor:grab;
    z-index:10;

    box-shadow:
        0 8px 22px rgba(0,0,0,.16),
        0 2px 7px rgba(0,0,0,.10);

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.cap-handle.dragging{
    cursor:grabbing;
    transform:scale(.94);

    box-shadow:
        0 5px 14px rgba(0,0,0,.18);
}


/* =========================================================
   MAIN DASHBOARD
========================================================= */

.dashboard{
    min-height:100vh;
    position:relative;
    padding:25px;

    display:none;
    opacity:0;
    transform:translateY(30px);

    transition:
        opacity 1s ease,
        transform 1s ease;
}

.dashboard.visible{
    display:block;
}

.dashboard.entered{
    opacity:1;
    transform:translateY(0);
}

.dashboard-background{
    position:fixed;
    inset:0;
    z-index:-3;

    background:#f5f5f5 center/cover no-repeat;
}

.dashboard-overlay{
    position:fixed;
    inset:0;
    z-index:-2;

    background:rgba(255,255,255,.76);
    backdrop-filter:blur(2px);
}

.dashboard-content{
    width:100%;
    max-width:1550px;
    margin:0 auto;
}


/* =========================================================
   TOP BAR
========================================================= */

.dashboard-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:22px;
}

.dashboard-logo{
    font-family:"Bricolage Grotesque",sans-serif;
    font-size:30px;
    font-weight:800;
    color:#8B5CF6;
    letter-spacing:-.04em;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    justify-content:flex-end;
}


/* =========================================================
   NOTIFICATIONS
========================================================= */

.notification-wrap{
    position:relative;
}

.notification-button{
    border:none;
    border-radius:18px;
    min-width:52px;
    height:48px;
    padding:0 15px;

    background:white;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;

    font-family:"DM Sans",sans-serif;
    font-size:20px;
    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 6px 20px rgba(0,0,0,.08);

    transition:.2s ease;

    position:relative;
}

.notification-button:hover{
    transform:translateY(-2px);

    box-shadow:
        0 9px 25px rgba(0,0,0,.10);
}

.notification-badge{
    position:absolute;
    top:-7px;
    right:-7px;

    min-width:22px;
    height:22px;

    padding:0 6px;

    border-radius:50px;

    background:#FF4D6D;
    color:white;

    display:none;
    align-items:center;
    justify-content:center;

    font-family:"DM Sans",sans-serif;
    font-size:11px;
    font-weight:800;

    border:3px solid white;
}

.notification-badge.show{
    display:flex;
}


/* =========================================================
   NOTIFICATION PANEL
========================================================= */

.notification-panel{
    position:absolute;

    top:calc(100% + 12px);
    right:0;

    width:min(390px,calc(100vw - 30px));
    max-height:500px;

    background:rgba(255,255,255,.97);

    border-radius:26px;

    padding:18px;

    box-shadow:
        0 20px 65px rgba(0,0,0,.16);

    backdrop-filter:blur(15px);

    z-index:80;

    display:none;

    animation:
        notificationIn .22s ease;
}

.notification-panel.open{
    display:block;
}

@keyframes notificationIn{

    from{
        opacity:0;
        transform:translateY(-8px) scale(.98);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}

.notification-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:12px;

    padding:3px 4px 14px;
}

.notification-title{
    font-family:"Bricolage Grotesque",sans-serif;
    font-size:25px;
    font-weight:800;
    letter-spacing:-.035em;
}

.notification-count{
    font-size:12px;
    font-weight:700;
    color:#737373;
}

.notification-list{
    display:flex;
    flex-direction:column;
    gap:9px;

    max-height:415px;
    overflow-y:auto;

    padding:2px;
}

.notification-task{
    width:100%;

    border:none;
    border-radius:17px;

    padding:15px 16px;

    text-align:left;

    cursor:pointer;

    color:#202333;

    display:flex;
    flex-direction:column;
    gap:4px;

    font-family:"DM Sans",sans-serif;
    font-weight:700;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        filter .18s ease;
}

.notification-task:hover{
    transform:translateY(-2px);

    box-shadow:
        0 7px 18px rgba(0,0,0,.10);

    filter:brightness(.98);
}

.notification-task-name{
    font-size:15px;
    line-height:1.35;

    overflow-wrap:anywhere;
}

.notification-task-subject{
    font-size:12px;
    font-weight:600;

    opacity:.72;
}

.notification-empty{
    padding:30px 18px;

    border-radius:18px;

    background:#F4F4F4;

    text-align:center;

    color:#777;

    font-size:14px;
    line-height:1.5;
}

.notification-empty-title{
    font-family:"Bricolage Grotesque",sans-serif;

    font-size:21px;
    font-weight:800;

    color:#333;

    margin-bottom:5px;
}


/* =========================================================
   BACKGROUND / PROFILE BUTTONS
========================================================= */

.background-button,
.profile-button{
    border:none;
    border-radius:18px;
    padding:12px 17px;

    background:white;

    font-family:"DM Sans",sans-serif;
    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 6px 20px rgba(0,0,0,.08);

    transition:.2s ease;
}

.background-button:hover,
.profile-button:hover{
    transform:translateY(-2px);
    box-shadow:
        0 9px 25px rgba(0,0,0,.10);
}

.profile-button{
    background:#E8DDFB;
}


/* =========================================================
   MAIN LAYOUT
========================================================= */

.dashboard-layout{
    display:grid;
    grid-template-columns:230px minmax(0,1fr);
    gap:20px;
    align-items:start;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    display:flex;
    flex-direction:column;
    gap:11px;
}

.side-tab-wrap{
    position:relative;
}

.side-tab{
    width:100%;
    border:none;
    padding:17px 16px;

    border-radius:18px;

    font-family:"DM Sans",sans-serif;
    font-size:15px;
    font-weight:700;
    text-align:left;

    cursor:pointer;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.side-tab:hover{
    transform:translateX(4px);

    box-shadow:
        0 7px 20px rgba(0,0,0,.08);
}

.side-tab.school{
    background:#B8DDF2;
}

.side-tab.email{
    background:#F9C6D0;
}

.side-tab.rubrics{
    background:#C8B9E8;
}

.side-tab.explanation{
    background:#B8E3D1;
}

.side-tab.command{
    background:#FDE3A7;
}

.side-tab.grade{
    background:#BFD7F2;
}

.side-tab.support{
    background:#F6C1A5;
}

.side-tab.exam{
    background:#D8B4E8;
}

.dots{
    position:absolute;
    right:8px;
    top:50%;

    transform:translateY(-50%);

    width:32px;
    height:32px;

    border:none;
    background:rgba(255,255,255,.45);

    border-radius:50%;

    cursor:pointer;
    font-size:18px;
    z-index:3;
}


/* =========================================================
   CALENDAR
========================================================= */

.calendar-card{
    background:rgba(255,255,255,.94);
    border-radius:32px;
    padding:25px;

    box-shadow:
        0 15px 50px rgba(0,0,0,.08);

    backdrop-filter:blur(12px);
}

.calendar-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;

    margin-bottom:20px;
}

.month-title{
    font-family:"Bricolage Grotesque",sans-serif;
    font-size:clamp(1.8rem,4vw,3rem);
    font-weight:800;
    letter-spacing:-.045em;
}

.calendar-nav{
    display:flex;
    align-items:center;
    gap:8px;
}

.calendar-nav button{
    border:none;
    background:transparent;

    font-family:"DM Sans",sans-serif;
    font-weight:700;

    cursor:pointer;
    color:#777;

    padding:7px 10px;
    border-radius:12px;

    transition:.2s ease;
}

.calendar-nav button:hover{
    background:#f3f3f3;
    color:#222;
}

.weekdays,
.calendar-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
}

.weekday{
    padding:12px 6px;
    text-align:center;
    font-size:13px;
    font-weight:700;
}

.weekday.weekend{
    background:#eeeeee;
}

.weekday.weekday-week{
    background:white;
}

.calendar-grid{
    border-radius:20px;
    overflow:hidden;
    border:1px solid #ededed;
}

.day-cell{
    min-height:125px;
    background:white;

    border-right:1px solid #ededed;
    border-bottom:1px solid #ededed;

    position:relative;
    padding:8px;

    cursor:pointer;

    transition:.15s ease;
}

.day-cell:hover{
    background:#fafafa;
}

.day-cell:nth-child(7n),
.day-cell:nth-child(7n-1){
    background:#f1f1f1;
}

.day-cell.empty{
    cursor:default;
    background:#f7f7f7;
}

.day-number{
    position:absolute;
    top:8px;
    right:9px;

    width:28px;
    height:28px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:13px;
    font-weight:700;
}

.today-number{
    background:#FF4D6D;
    color:white;
    border-radius:50%;
}

.task-list{
    position:absolute;
    left:7px;
    right:7px;
    top:43px;

    display:flex;
    flex-direction:column;
    gap:4px;
}

.calendar-task{
    border-radius:8px;
    padding:5px 7px;

    font-size:11px;
    font-weight:700;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;

    cursor:pointer;

    transition:.15s ease;
}

.calendar-task:hover{
    transform:translateY(-1px);
}


/* =========================================================
   TASK PANEL
========================================================= */

.modal-backdrop{
    position:fixed;
    inset:0;

    background:rgba(255,255,255,.34);
    backdrop-filter:blur(10px);

    z-index:100;

    display:none;

    padding:18px;
    overflow:auto;
}

.modal-backdrop.open{
    display:flex;
    align-items:center;
    justify-content:center;
}

.task-panel{
    width:min(1250px,100%);
    max-height:calc(100vh - 36px);

    overflow:auto;

    background:white;

    border-radius:35px;
    padding:45px;

    box-shadow:
        0 25px 90px rgba(0,0,0,.18);

    position:relative;

    animation:panelIn .35s ease;
}

@keyframes panelIn{
    from{
        opacity:0;
        transform:translateY(25px) scale(.98);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.close-panel{
    position:absolute;
    right:25px;
    top:22px;

    width:43px;
    height:43px;

    border:none;
    border-radius:50%;

    background:#f2f2f2;

    cursor:pointer;
    font-size:22px;
}

.task-title{
    border:none;
    outline:none;

    width:100%;

    font-family:"Bricolage Grotesque",sans-serif;
    font-size:clamp(2.5rem,6vw,5rem);
    font-weight:800;

    color:#222;

    letter-spacing:-.055em;

    margin-bottom:35px;
}

.task-title::placeholder{
    color:#cfcfcf;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:28px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.field.full{
    grid-column:1/-1;
}

.field-label{
    font-size:13px;
    font-weight:700;
    color:#777;
}

.field input,
.field textarea,
.field select{
    width:100%;

    border:1px solid #e5e5e5;
    background:#fafafa;

    border-radius:15px;

    padding:14px 15px;

    font-family:"DM Sans",sans-serif;
    font-size:15px;

    outline:none;

    transition:.2s ease;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:#A855F7;
    background:white;
}

.field textarea{
    min-height:130px;
    resize:vertical;
}


/* =========================================================
   COURSE CHOICES
========================================================= */

.course-options{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
}

.course-option{
    border:2px solid transparent;
    border-radius:13px;

    padding:11px 14px;

    font-family:"DM Sans",sans-serif;
    font-weight:700;

    cursor:pointer;

    transition:.2s ease;
}

.course-option:hover{
    transform:translateY(-1px);
}

.course-option.selected{
    transform:translateY(-2px);

    box-shadow:
        0 5px 15px rgba(0,0,0,.09);

    outline:
        3px solid rgba(139,92,246,.18);
}


/* =========================================================
   MASTERY
========================================================= */

.status-options{
    display:flex;
    flex-direction:column;

    border:1px solid #ececec;
    border-radius:17px;

    overflow:hidden;
}

.status-group{
    padding:14px;
    border-bottom:1px solid #e5e5e5;
}

.status-group:last-child{
    border-bottom:none;
}

.status-group-title{
    font-size:12px;
    font-weight:800;

    text-transform:uppercase;

    color:#777;

    margin-bottom:8px;
}

.status-option{
    display:inline-flex;
    align-items:center;

    border:none;
    border-radius:11px;

    padding:9px 13px;

    font-family:"DM Sans",sans-serif;
    font-weight:700;

    cursor:pointer;

    transition:.2s ease;
}

.status-option.selected{
    outline:3px solid rgba(0,0,0,.08);
}


/* =========================================================
   ASSIGNMENTS
========================================================= */

.assignment-search{
    margin-bottom:12px;
}

.assignment-options{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.assignment-option{
    border:none;
    border-radius:13px;

    padding:13px 15px;

    font-family:"DM Sans",sans-serif;
    font-weight:700;

    text-align:left;

    cursor:pointer;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.assignment-option:hover{
    filter:brightness(.97);
}

.assignment-menu{
    border:none;
    background:rgba(255,255,255,.45);

    width:28px;
    height:28px;

    border-radius:50%;

    cursor:pointer;
}

.create-custom{
    border:2px dashed #bbb;
    border-radius:13px;

    padding:12px;

    background:white;

    cursor:pointer;

    font-family:"DM Sans",sans-serif;
    font-weight:700;

    text-align:left;
}


/* =========================================================
   ADD TASK
========================================================= */

.add-task{
    margin-top:35px;

    width:100%;

    border:none;

    background:#A7E8BD;

    border-radius:18px;

    padding:18px;

    font-family:"DM Sans",sans-serif;
    font-size:17px;
    font-weight:800;

    cursor:pointer;

    transition:.2s ease;
}

.add-task:hover{
    transform:translateY(-2px);

    box-shadow:
        0 10px 25px rgba(0,0,0,.08);
}


/* =========================================================
   CELEBRATION
========================================================= */

.celebration{
    position:fixed;
    inset:0;

    z-index:300;

    display:none;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    background:rgba(255,255,255,.5);
    backdrop-filter:blur(14px);
}

.celebration.show{
    display:flex;
}

.checkmark{
    width:110px;
    height:110px;

    border-radius:50%;

    background:#A7E8BD;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:60px;

    animation:
        checkPop .65s cubic-bezier(.17,.89,.32,1.35);
}

@keyframes checkPop{
    0%{
        transform:scale(.3);
        opacity:0;
    }

    70%{
        transform:scale(1.12);
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

.celebration h2{
    font-family:"Bricolage Grotesque",sans-serif;

    font-size:
        clamp(2.4rem,6vw,5rem);

    margin-top:20px;

    letter-spacing:-.05em;
}

.celebration p{
    margin-top:7px;
    color:#666;
}

.confetti{
    position:absolute;

    width:9px;
    height:14px;

    border-radius:3px;

    animation:
        confettiFall 1.8s ease-out forwards;
}

@keyframes confettiFall{
    from{
        transform:
            translate(0,0)
            rotate(0);

        opacity:1;
    }

    to{
        transform:
            translate(var(--x),var(--y))
            rotate(600deg);

        opacity:0;
    }
}


/* =========================================================
   LINK POPUP
========================================================= */

.small-popup{
    position:fixed;

    z-index:250;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    background:white;

    width:min(500px,calc(100% - 30px));

    border-radius:25px;
    padding:28px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.2);

    display:none;
}

.small-popup.open{
    display:block;
}

.small-popup h3{
    font-family:"Bricolage Grotesque",sans-serif;

    font-size:28px;

    margin-bottom:17px;
}

.small-popup input{
    width:100%;

    border:1px solid #ddd;

    border-radius:13px;

    padding:13px;

    font-family:"DM Sans",sans-serif;
}

.popup-buttons{
    display:flex;
    gap:8px;

    margin-top:15px;
}

.popup-buttons button{
    flex:1;

    border:none;
    border-radius:13px;

    padding:12px;

    font-family:"DM Sans",sans-serif;
    font-weight:700;

    cursor:pointer;
}

.save-link{
    background:#A7E8BD;
}

.cancel-link{
    background:#eee;
}


/* =========================================================
   RESPONSIVE
========================================================= */

/* =========================================================
   LOCK-IN SLIDER
========================================================= */

function updateSlider(clientX){

    if(completed){
        return;
    }


    const rect =
        lockSlider.getBoundingClientRect();


    const handleSize =
        capHandle.offsetWidth;


    const min = 8;


    const max =
        Math.max(
            min,
            rect.width -
            handleSize -
            8
        );


    let x =
        clientX -
        rect.left -
        handleSize / 2;


    x =
        Math.max(
            min,
            Math.min(
                x,
                max
            )
        );


    const percentage =
        (x - min) /
        (max - min);


    const percent =
        percentage * 100;


    capHandle.style.left =
        `${x}px`;


    lockProgress.style.width =
        `${percent}%`;


    if(percent >= 98){

        completeLockIn();

    }

}


/* =========================================================
   DRAGGING
========================================================= */

function startDrag(event){

    if(completed){
        return;
    }

    dragging = true;

    capHandle.classList.add(
        "dragging"
    );


    const point =
        event.touches
        ? event.touches[0]
        : event;


    updateSlider(
        point.clientX
    );


    if(event.cancelable){
        event.preventDefault();
    }

}


function drag(event){

    if(
        !dragging ||
        completed
    ){
        return;
    }


    const point =
        event.touches
        ? event.touches[0]
        : event;


    updateSlider(
        point.clientX
    );


    if(event.cancelable){
        event.preventDefault();
    }

}


function stopDrag(){

    dragging = false;

    capHandle.classList.remove(
        "dragging"
    );

}

async function completeLockIn(){

    if(completed){
        return;
    }


    completed = true;

    dragging = false;


    capHandle.classList.remove(
        "dragging"
    );


    const finalPosition =
        Math.max(
            8,
            lockSlider.offsetWidth -
            capHandle.offsetWidth -
            8
        );


    capHandle.style.left =
        `${finalPosition}px`;


    lockProgress.style.width =
        "100%";


    lockText.textContent =
        "We're locked in!";


    if(currentUser){

        try{

            await setDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid
                ),
                {
                    lockedIn:true,
                    updatedAt:
                        serverTimestamp()
                },
                {
                    merge:true
                }
            );

        }catch(error){

            console.warn(
                "Lock-in state could not be saved. Continuing.",
                error
            );

        }

    }


    setTimeout(() => {

        showDashboard();

    },700);

}

async function loadUserData(){

    try{

        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const snapshot =
            await getDoc(
                userRef
            );


        if(snapshot.exists()){

            const data =
                snapshot.data();


            selectedSubjects =
                Array.isArray(
                    data.subjects
                )
                ? data.subjects
                : [];


            tasks =
                Array.isArray(
                    data.tasks
                )
                ? data.tasks
                : [];


            customAssignmentCategories =
                Array.isArray(
                    data.customAssignmentCategories
                )
                ? data.customAssignmentCategories
                : [];


            schoolWebUrl =
                data.schoolWebUrl ||
                "";


            emailUrl =
                data.emailUrl ||
                "";


            if(data.backgroundImageUrl){

                dashboardBackground.style.backgroundImage =
                    `url("${data.backgroundImageUrl}")`;

            }


            if(schoolWebUrl){

                localStorage.setItem(
                    `mypHaven_school_${currentUser.uid}`,
                    schoolWebUrl
                );

            }


            if(emailUrl){

                localStorage.setItem(
                    `mypHaven_email_${currentUser.uid}`,
                    emailUrl
                );

            }


            renderCourses();

            renderCalendar();

            updateNotifications();


            if(data.lockedIn === true){

                completed = true;

                lockProgress.style.width =
                    "100%";


                const finalPosition =
                    Math.max(
                        8,
                        lockSlider.offsetWidth -
                        capHandle.offsetWidth -
                        8
                    );


                capHandle.style.left =
                    `${finalPosition}px`;


                lockText.textContent =
                    "We're locked in!";


                setTimeout(() => {

                    showDashboard();

                },100);

            }

        }else{

            selectedSubjects = [];

            tasks = [];

            customAssignmentCategories = [];

            renderCourses();

            renderCalendar();

            updateNotifications();

        }

    }catch(error){

        console.error(
            "Could not load dashboard:",
            error
        );

        loadLocalFallback();

    }

}

async function saveDashboard(){

    if(!currentUser){
        return;
    }


    const background =
        dashboardBackground.style.backgroundImage;


    const localData = {

        tasks,

        subjects:
            selectedSubjects,

        customAssignmentCategories,

        backgroundImage:
            background

    };


    localStorage.setItem(
        `mypHavenDashboard_${currentUser.uid}`,
        JSON.stringify(

        )
    );


    try{

        await setDoc(
            doc(
                db,
                "users",
                currentUser.uid
            ),
            {

                tasks,

                subjects:
                    selectedSubjects,

                customAssignmentCategories,

                updatedAt:
                    serverTimestamp()

            },
            {
                merge:true
            }
        );

    }catch(error){

            "Dashboard saved locally:",
            error
        );

    }

}


/* =========================================================
   NOTIFICATIONS
========================================================= */

function getTodayDateKey(){

    const today =
        new Date();

    return makeDateKey(
        today.getFullYear(),
        today.getMonth(),
        today.getDate()
    );

}


function getTasksDueToday(){

    const todayKey =
        getTodayDateKey();


    return tasks.filter(
        task =>

            task.dueDate ===
            todayKey

            &&

            task.status !==
            "Done"

    );

}


function updateNotifications(){

    const dueTodayTasks =
        getTasksDueToday();


    notificationList.innerHTML =
        "";


    const count =
        dueTodayTasks.length;


    if(count > 0){

        notificationBadge.textContent =
            count;

        notificationBadge.classList.add(
            "show"
        );

        notificationCount.textContent =
            count === 1
            ? "1 task needs your attention"
            : `${count} tasks need your attention`;


        dueTodayTasks.forEach(
            task => {

                const taskButton =
                    document.createElement(
                        "button"
                    );


                taskButton.type =
                    "button";


                taskButton.className =
                    "notification-task";


                /*
                 * The entire notification uses
                 * the task's subject colour.
                 */

                taskButton.style.background =
                    subjectColors[
                        task.course
                    ] ||
                    "#E8B8D4";


                const taskName =
                    document.createElement(
                        "span"
                    );


                taskName.className =
                    "notification-task-name";


                taskName.textContent =
                    task.title ||
                    "Untitled Task";


                const taskSubject =
                    document.createElement(
                        "span"
                    );


                taskSubject.className =
                    "notification-task-subject";


                taskSubject.textContent =
                    task.course ||
                    "Other";


                taskButton.appendChild(
                    taskName
                );


                taskButton.appendChild(
                    taskSubject
                );


                taskButton.addEventListener(
                    "click",
                    () => {

                        closeNotifications();

                        openTaskEditor(
                            task.id
                        );

                    }
                );


                notificationList.appendChild(
                    taskButton
                );

            }
        );

    }else{

        notificationBadge.classList.remove(
            "show"
        );


        notificationCount.textContent =
            "No tasks due today";


        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "notification-empty";


        empty.innerHTML = `

            <div class="notification-empty-title">
                You're all caught up!
            </div>

            <div>
                You have no unfinished tasks due today.
            </div>

        `;


        notificationList.appendChild(
            empty
        );

    }

}

/* =========================================================
   CALENDAR
========================================================= */

function renderCalendar(){

    const year =
        currentCalendarDate.getFullYear();


    const month =
        currentCalendarDate.getMonth();


    monthTitle.textContent =
        new Date(
            year,
            month,
            1
        ).toLocaleDateString(
            undefined,
            {
                month:"long",
                year:"numeric"
            }
        );


    calendarGrid.innerHTML =
        "";


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    for(
        let i = 0;
        i < firstDay;
        i++
    ){

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "day-cell empty";


        calendarGrid.appendChild(
            empty
        );

    }


    for(
        let day = 1;
        day <= daysInMonth;
        day++
    ){

        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "day-cell";


        const number =
            document.createElement(
                "div"
            );


        number.className =
            "day-number";


        number.textContent =
            day;


        const now =
            new Date();


        if(
            day === now.getDate() &&
            month === now.getMonth() &&
            year === now.getFullYear()
        ){

            number.classList.add(
                "today-number"
            );

        }


        cell.appendChild(
            number
        );


        const list =
            document.createElement(
                "div"
            );


        list.className =
            "task-list";


        const dateKey =
            makeDateKey(
                year,
                month,
                day
            );


        const dayTasks =
            tasks.filter(
                task =>
                    task.date ===
                    dateKey
            );


        dayTasks.forEach(
            task => {

                const taskElement =
                    document.createElement(
                        "div"
                    );


                taskElement.className =
                    "calendar-task";


                taskElement.textContent =
                    task.title ||
                    "Untitled";


                taskElement.style.background =
                    getTaskColor(
                        task
                    );


                taskElement.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();


                        openTaskEditor(
                            task.id
                        );

                    }
                );


                list.appendChild(
                    taskElement
                );

            }
        );


        cell.appendChild(
            list
        );


        cell.addEventListener(
            "dblclick",
            () => {

                openTaskCreator(
                    dateKey
                );

            }
        );


        calendarGrid.appendChild(
            cell
        );

    }


    updateNotifications();

}


/* =========================================================
   DATE KEY
========================================================= */

function makeDateKey(
    year,
    month,
    day
){

    return [

        year,

        String(
            month + 1
        ).padStart(
            2,
            "0"
        ),

        String(
            day
        ).padStart(
            2,
            "0"
        )

    ].join("-");

}

   TASK COLOR
========================================================= */

function getTaskColor(task){

    if(
        task.status ===
        "Done"
    ){

        return "#D8B9E8";

    if(task.course){

        return (
            subjectColors[
                task.course
            ] ||
            "#E8B8D4"
        );

    }


    return "#D9D6E8";

}

function renderAssignments(){

    assignmentOptions.innerHTML =
        "";


    const all = [

        ...permanentAssignments,

        ...customAssignmentCategories

    ];


    const search =
        assignmentSearch.value
            .trim()
            .toLowerCase();


    const filtered =
        all.filter(
            option =>
                option.name
                    .toLowerCase()
                    .includes(search)
        );


    filtered.forEach(
        option => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "assignment-option";


            row.style.background =
                option.color;


            const text =
                document.createElement(
                    "span"
                );


            text.textContent =
                option.name;


            row.appendChild(
                text
            );


            const permanent =
                permanentAssignments.some(
                    item =>
                        item.name ===
                        option.name
                );


            if(!permanent){

                const menu =
                    document.createElement(
                        "button"
                    );


                menu.type =
                    "button";


                menu.className =
                    "assignment-menu";


                menu.textContent =
                    "⋯";


                menu.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                        manageCustomCategory(
                            option
                        );

                    }
                );


                row.appendChild(
                    menu
                );

            }


            if(
                selectedAssignment ===
                option.name
            ){

                row.style.outline =
                    "3px solid rgba(0,0,0,.10)";

            }


            row.addEventListener(
                "click",
                () => {

                    selectedAssignment =
                        option.name;


                    document
                        .querySelectorAll(
                            ".assignment-option"
                        )
                        .forEach(
                            item =>
                                item.style.outline =
                                    "none"
                        );


                    row.style.outline =
                        "3px solid rgba(0,0,0,.10)";

                }
            );


            assignmentOptions.appendChild(
                row
            );

        }
    );


    if(
        search &&
        !all.some(
            option =>
                option.name
                    .toLowerCase() ===
                search
        )
    ){

        const create =
            document.createElement(
                "button"
            );


        create.type =
            "button";


        create.className =
            "create-custom";


        create.textContent =
            `Create ${assignmentSearch.value}`;


        create.addEventListener(
            "click",
            () => {

                createCustomCategory(
                    assignmentSearch.value.trim()
                );

            }
        );


        assignmentOptions.appendChild(
            create
        );

    }

}

);


function createCustomCategory(
    name
){

    if(!name){
        return;
    }


    const exists =
        permanentAssignments.some(
            item =>
                item.name.toLowerCase() ===
                name.toLowerCase()
        ) ||
        customAssignmentCategories.some(
            item =>
                item.name.toLowerCase() ===
                name.toLowerCase()
        );


    if(exists){

        selectedAssignment =
            name;

        renderAssignments();

        return;

    }


    const category = {

        id:
            "custom_" +
            Date.now(),

        name,

        color:
            "#E8B8D4"

    };


    customAssignmentCategories.push(
        category
    );


    selectedAssignment =
        name;


    assignmentSearch.value =
        "";


    renderAssignments();

    saveDashboard();

}


/* =========================================================
   CUSTOM CATEGORIES
========================================================= */

function manageCustomCategory(
    category
){

    const action =
        prompt(
            `${category.name}\n\nType:\nrename\ncolor\ndelete`
        );


    if(!action){
        return;
    }


    if(
        action.toLowerCase() ===
        "rename"
    ){

        const name =
            prompt(
                "New category name:",
                category.name
            );


        if(name){

            category.name =
                name;

            renderAssignments();

            saveDashboard();

        }

    }


    else if(
        action.toLowerCase() ===
        "color"
    ){

        const color =
            prompt(
                "Enter a HEX color:",
                category.color
            );


        if(
            color &&
            /^#[0-9A-F]{6}$/i.test(
                color
            )
        ){

            category.color =
                color;

            renderAssignments();

            saveDashboard();

        }

    }


    else if(
        action.toLowerCase() ===
        "delete"
    ){

        const confirmed =
            confirm(
                "Delete this custom category?"
            );


        if(confirmed){

            customAssignmentCategories =
                customAssignmentCategories.filter(
                    item =>
                        item.id !==
                        category.id
                );


            if(
                selectedAssignment ===
                category.name
            ){

                selectedAssignment =
                    "";

            }


            renderAssignments();

            saveDashboard();

        }

    }

}


/* =========================================================
   DAYS LEFT
========================================================= */

dueDate.addEventListener(
    "change",
    updateDaysLeft
);


function updateDaysLeft(){

    if(!dueDate.value){

        daysLeft.value =
            "Select a due date";

        return;

    }


    if(
        selectedStatus ===
        "Done"
    ){

        daysLeft.value =
            "COMPLETED";

        return;

    }


    const today =
        new Date();


    today.setHours(
        0,
        0,
        0,
        0
    );


    const due =
        new Date(
            dueDate.value +
            "T00:00:00"
        );


    const difference =
        Math.round(
            (
                due.getTime() -
                today.getTime()
            ) /
            86400000
        );


    if(difference > 0){

        daysLeft.value =
            `${difference} Days Left`;

    }

    else if(difference === 0){

        daysLeft.value =
            "Due Today";

    }

    else{

        daysLeft.value =
            `🚨 DUE DATE Passed — ${difference} Days Late`;

    }

}

                );

                );

            }


            const existingTask =
                tasks.find(
                    item =>
                        item.id ===
                        editingTaskId
                );


            const task = {

                id:
                    editingTaskId ||
                    `task_${Date.now()}`,

                dueDate:
                    dueDate.value,

                notes:
                    taskNotes.value.trim(),

                createdAt:
                    existingTask?.createdAt ||
                    new Date().toISOString()

            };


            if(editingTaskId){

                tasks =
                    tasks.map(
                        item =>
                            item.id ===
                            editingTaskId
                            ? task
                            : item
                    );

            }else{

                tasks.push(
                    task
                );

            renderCalendar();

            updateNotifications();

            await saveDashboard();

            showTaskCelebration();

function createConfetti(
    count
){

    const pastelColors = [

        "#FFB6C1",
        "#FFD6A5",
        "#FDFFB6",
        "#CAFFBF",
        "#BDE0FE",
        "#CDB4DB"

    ];


    for(
        let i = 0;
        i < count;
        i++
    ){

        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "confetti";


        piece.style.background =
            pastelColors[
                Math.floor(
                    Math.random() *
                    pastelColors.length
                )
            ];


        piece.style.left =
            "50%";


        piece.style.top =
            "50%";


        piece.style.setProperty(
            "--x",
            `${(Math.random()-.5)*700}px`
        );


        piece.style.setProperty(
            "--y",
            `${(Math.random()-.5)*500}px`
        );


        document.body.appendChild(
            piece
        );


        setTimeout(
            () =>
                piece.remove(),
            2000
        );

    }

}


/* =========================================================
   SCHOOL / EMAIL
========================================================= */

const schoolButton =
    document.getElementById(
        "schoolButton"
    );

const emailButton =
    document.getElementById(
        "emailButton"
    );

const linkPopup =
    document.getElementById(
        "linkPopup"
    );

const linkPopupTitle =
    document.getElementById(
        "linkPopupTitle"
    );

const linkInput =
    document.getElementById(
        "linkInput"
    );


document
    .querySelectorAll(
        ".dots"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                event => {

                    event.stopPropagation();


                    if(!currentUser){
                        return;
                    }


                    linkType =
                        button.dataset.link;


                    linkPopupTitle.textContent =
                        linkType === "school"
                        ? "School Web"
                        : "Email";


                    const firebaseUrl =
                        linkType === "school"
                        ? schoolWebUrl
                        : emailUrl;


                    const saved =
                        firebaseUrl ||
                        localStorage.getItem(
                            `mypHaven_${linkType}_${currentUser.uid}`
                        ) ||
                        "";


                    linkInput.value =
                        saved;


                    linkPopup.classList.add(
                        "open"
                    );

                }
            );

        }
    );


schoolButton.addEventListener(
    "click",
    () =>
        openSavedLink(
            "school"
        )
);


emailButton.addEventListener(
    "click",
    () =>
        openSavedLink(
            "email"
        )
);


function openSavedLink(
    type
){

    if(!currentUser){
        return;
    }


    const firebaseUrl =
        type === "school"
        ? schoolWebUrl
        : emailUrl;


    const url =
        firebaseUrl ||
        localStorage.getItem(
            `mypHaven_${type}_${currentUser.uid}`
        );


    if(!url){

        linkType =
            type;


        linkPopupTitle.textContent =
            type === "school"
            ? "School Web"
            : "Email";


        linkInput.value =
            "";


        linkPopup.classList.add(
            "open"
        );


        return;

    }


    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );

}


document
    .getElementById(
        "saveLink"
    )
    .addEventListener(
        "click",
        async () => {

            if(!currentUser){
                return;
            }


            let url =
                linkInput.value.trim();


            if(!url){
                return;
            }


            if(
                !url.startsWith(
                    "http://"
                ) &&
                !url.startsWith(
                    "https://"
                )
            ){

                url =
                    "https://" +
                    url;

            }


            localStorage.setItem(
                `mypHaven_${linkType}_${currentUser.uid}`,
                url
            );


            if(linkType === "school"){

                schoolWebUrl =
                    url;

            }else{

                emailUrl =
                    url;

            }


            try{

                await setDoc(
                    doc(
                        db,
                        "users",
                        currentUser.uid
                    ),
                    {

                        [
                            linkType === "school"
                            ? "schoolWebUrl"
                            : "emailUrl"
                        ]:
                            url,

                        updatedAt:
                            serverTimestamp()

                    },
                    {
                        merge:true
                    }
                );

            }catch(error){

                console.warn(
                    "Link saved locally.",
                    error
                );

            }


            linkPopup.classList.remove(
                "open"
            );

        }
    );


document
    .getElementById(
        "cancelLink"
    )
    .addEventListener(
        "click",
        () => {

            linkPopup.classList.remove(
                "open"
            );

        }
    );

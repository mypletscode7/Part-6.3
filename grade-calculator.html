<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculate Your Final Scaled Mark | MYP Haven</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#FAF8F6;
    color:#202333;
    font-family:"DM Sans", sans-serif;
    padding:30px 40px 70px;
}

/* =========================
   TOP NAVIGATION
========================= */

.top-navigation{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:45px;
}

.home-cap{
    border:none;
    background:transparent;
    font-size:30px;
    cursor:pointer;
    padding:6px;
    transition:transform 0.2s ease;
}

.home-cap:hover{
    transform:scale(1.1);
}

.back-dashboard{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    background:#000;
    color:#fff;

    text-decoration:none;
    font-weight:700;
    font-size:15px;

    padding:13px 20px;
    border-radius:14px;

    transition:
        transform 0.2s ease,
        opacity 0.2s ease;
}

.back-dashboard:hover{
    transform:translateY(-2px);
    opacity:0.9;
}

/* =========================
   PAGE HEADER
========================= */

.page-header{
    text-align:center;
    max-width:800px;
    margin:0 auto 45px;
}

.page-header h1{
    font-family:"Bricolage Grotesque", sans-serif;
    font-size:clamp(38px, 6vw, 64px);
    line-height:1.05;
    font-weight:800;
    letter-spacing:-2px;
    margin-bottom:18px;
}

.page-header p{
    font-size:17px;
    line-height:1.7;
    color:#626676;
    max-width:680px;
    margin:0 auto;
}

/* =========================
   CALCULATOR
========================= */

.calculator-container{
    width:100%;
    max-width:900px;
    margin:0 auto;
}

.criteria-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:22px;
}

.criterion-card{
    min-height:250px;
    border-radius:30px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    padding:35px;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.criterion-card:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 30px rgba(32,35,51,0.08);
}

.criterion-letter{
    font-family:"Bricolage Grotesque", sans-serif;
    font-size:70px;
    line-height:1;
    font-weight:800;
    margin-bottom:22px;
}

.criterion-card input{
    width:150px;
    height:65px;

    border:none;
    outline:none;

    background:rgba(255,255,255,0.72);

    border-radius:18px;

    text-align:center;

    font-family:"DM Sans", sans-serif;
    font-size:25px;
    font-weight:700;

    color:#202333;

    box-shadow:0 4px 15px rgba(32,35,51,0.06);

    transition:
        background 0.2s ease,
        box-shadow 0.2s ease;
}

.criterion-card input:focus{
    background:#fff;
    box-shadow:
        0 0 0 4px rgba(255,255,255,0.65),
        0 8px 20px rgba(32,35,51,0.08);
}

.criterion-card input::placeholder{
    color:#777;
    opacity:0.6;
}

/* Remove number input arrows */

.criterion-card input::-webkit-outer-spin-button,
.criterion-card input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
}

.criterion-card input[type=number]{
    -moz-appearance:textfield;
}

/* Criterion colours */

.criterion-a{
    background:#FFB3C6;
}

.criterion-b{
    background:#FFE69A;
}

.criterion-c{
    background:#A8E6CF;
}

.criterion-d{
    background:#CDB4DB;
}

/* =========================
   CALCULATE BUTTON
========================= */

.calculate-section{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top:30px;
}

.calculate-button{
    width:100%;
    max-width:500px;

    border:none;

    background:#202333;
    color:#fff;

    font-family:"Bricolage Grotesque", sans-serif;
    font-size:23px;
    font-weight:700;

    padding:21px 35px;

    border-radius:22px;

    cursor:pointer;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
}

.calculate-button:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 25px rgba(32,35,51,0.16);
}

.calculate-button:active{
    transform:translateY(0);
}

/* =========================
   ERROR
========================= */

.error-message{
    margin-top:15px;
    color:#D93652;
    font-size:14px;
    font-weight:600;
    text-align:center;
    min-height:20px;
}

/* =========================
   RESULT
========================= */

.result-wrapper{
    display:none;
    justify-content:center;
    margin-top:35px;
}

.result-wrapper.show{
    display:flex;
    animation:resultAppear 0.55s ease forwards;
}

.result-card{
    width:100%;
    max-width:650px;

    background:#fff;

    border-radius:32px;

    padding:50px 35px;

    text-align:center;

    box-shadow:
        0 20px 60px rgba(32,35,51,0.10);
}

.result-label{
    font-family:"Bricolage Grotesque", sans-serif;
    font-size:24px;
    font-weight:700;
    margin-bottom:20px;
}

.result-score-container{
    display:flex;
    justify-content:center;
    align-items:baseline;
    gap:8px;

    margin-bottom:20px;
}

.result-score{
    font-family:"Bricolage Grotesque", sans-serif;
    font-size:clamp(90px, 15vw, 150px);
    line-height:0.9;
    font-weight:800;
    letter-spacing:-6px;

    animation:scorePop 0.65s cubic-bezier(.17,.67,.35,1.4) forwards;
}

.result-out-of{
    font-family:"Bricolage Grotesque", sans-serif;
    font-size:35px;
    font-weight:700;
    color:#777;
}

.result-message{
    color:#626676;
    font-size:16px;
    line-height:1.6;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes resultAppear{

    0%{
        opacity:0;
        transform:translateY(25px) scale(0.96);
    }

    100%{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}

@keyframes scorePop{

    0%{
        transform:scale(0.4);
        opacity:0;
    }

    70%{
        transform:scale(1.12);
        opacity:1;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }

}

/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    body{
        padding:20px 18px 50px;
    }

    .top-navigation{
        margin-bottom:35px;
    }

    .home-cap{
        font-size:26px;
    }

    .back-dashboard{
        font-size:13px;
        padding:11px 15px;
        border-radius:12px;
    }

    .page-header{
        margin-bottom:30px;
    }

    .page-header h1{
        font-size:42px;
        letter-spacing:-1.5px;
    }

    .page-header p{
        font-size:15px;
    }

    .criteria-grid{
        grid-template-columns:1fr;
        gap:16px;
    }

    .criterion-card{
        min-height:210px;
        border-radius:25px;
    }

    .criterion-letter{
        font-size:60px;
    }

    .calculate-button{
        font-size:20px;
        padding:18px 25px;
    }

    .result-card{
        padding:40px 25px;
        border-radius:26px;
    }

    .result-score{
        font-size:105px;
    }

}

</style>
</head>

<body>

<!-- =========================
     TOP NAVIGATION
========================= -->

<div class="top-navigation">

    <button
        class="home-cap"
        id="homeCap"
        aria-label="Refresh page"
        title="Refresh"
    >
        🎓
    </button>

    <a
        href="dashboard.html"
        class="back-dashboard"
    >
        Back to Dashboard
    </a>

</div>


<!-- =========================
     PAGE HEADER
========================= -->

<header class="page-header">

    <h1>
        Calculate Your Final Scaled Mark
    </h1>

    <p>
        Enter your final criterion marks from 0–8.
        Make sure all four criteria are filled in before calculating your final MYP scaled mark.
    </p>

</header>


<!-- =========================
     CALCULATOR
========================= -->

<main class="calculator-container">

    <div class="criteria-grid">

        <!-- Criterion A -->

        <div class="criterion-card criterion-a">

            <div class="criterion-letter">
                A
            </div>

            <input
                type="number"
                id="criterionA"
                min="0"
                max="8"
                step="1"
                inputmode="numeric"
                placeholder="0–8"
                aria-label="Criterion A mark"
            >

        </div>


        <!-- Criterion B -->

        <div class="criterion-card criterion-b">

            <div class="criterion-letter">
                B
            </div>

            <input
                type="number"
                id="criterionB"
                min="0"
                max="8"
                step="1"
                inputmode="numeric"
                placeholder="0–8"
                aria-label="Criterion B mark"
            >

        </div>


        <!-- Criterion C -->

        <div class="criterion-card criterion-c">

            <div class="criterion-letter">
                C
            </div>

            <input
                type="number"
                id="criterionC"
                min="0"
                max="8"
                step="1"
                inputmode="numeric"
                placeholder="0–8"
                aria-label="Criterion C mark"
            >

        </div>


        <!-- Criterion D -->

        <div class="criterion-card criterion-d">

            <div class="criterion-letter">
                D
            </div>

            <input
                type="number"
                id="criterionD"
                min="0"
                max="8"
                step="1"
                inputmode="numeric"
                placeholder="0–8"
                aria-label="Criterion D mark"
            >

        </div>

    </div>


    <!-- =========================
         CALCULATE
    ========================= -->

    <div class="calculate-section">

        <button
            class="calculate-button"
            id="calculateButton"
        >
            Calculate
        </button>

        <div
            class="error-message"
            id="errorMessage"
            aria-live="polite"
        ></div>

    </div>


    <!-- =========================
         RESULT
    ========================= -->

    <div
        class="result-wrapper"
        id="resultWrapper"
    >

        <div class="result-card">

            <div class="result-label">
                Your Final Scaled Mark
            </div>

            <div class="result-score-container">

                <div
                    class="result-score"
                    id="resultScore"
                >
                    0
                </div>

                <div class="result-out-of">
                    /7
                </div>

            </div>

            <p
                class="result-message"
                id="resultMessage"
            ></p>

        </div>

    </div>

</main>


<script>

/* =========================
   REFRESH WITH GRADUATION CAP
========================= */

document
    .getElementById("homeCap")
    .addEventListener("click", function(){

        window.location.reload();

    });


/* =========================
   INPUTS
========================= */

const inputs = [

    document.getElementById("criterionA"),
    document.getElementById("criterionB"),
    document.getElementById("criterionC"),
    document.getElementById("criterionD")

];


/* =========================
   LIMIT INPUTS TO 0–8
========================= */

inputs.forEach(input => {

    input.addEventListener("input", function(){

        let value = this.value;

        value = value.replace(/[^0-9]/g, "");

        if(value !== ""){

            let number = parseInt(value, 10);

            if(number > 8){
                number = 8;
            }

            this.value = number;

        }

    });


    input.addEventListener("keydown", function(event){

        if(
            event.key === "." ||
            event.key === "-" ||
            event.key === "+" ||
            event.key === "e" ||
            event.key === "E"
        ){

            event.preventDefault();

        }

    });

});


/* =========================
   GRADE BOUNDARIES
========================= */

const gradeBoundaries = {

    7: 28,
    6: 24,
    5: 19,
    4: 15,
    3: 10,
    2: 6,
    1: 1

};


/* =========================
   CALCULATE GRADE
========================= */

function getFinalGrade(total){

    const grades = Object.keys(gradeBoundaries)
        .map(Number)
        .sort((a,b) => b-a);

    for(const grade of grades){

        if(total >= gradeBoundaries[grade]){

            return grade;

        }

    }

    return 1;

}


/* =========================
   CALCULATE BUTTON
========================= */

document
    .getElementById("calculateButton")
    .addEventListener("click", function(){

        const errorMessage =
            document.getElementById("errorMessage");

        const resultWrapper =
            document.getElementById("resultWrapper");

        const resultScore =
            document.getElementById("resultScore");

        const resultMessage =
            document.getElementById("resultMessage");


        /* Clear previous error */

        errorMessage.textContent = "";


        /* Get values */

        const values = inputs.map(input => {

            return input.value.trim();

        });


        /* Check all boxes */

        const allFilled = values.every(value => value !== "");

        if(!allFilled){

            errorMessage.textContent =
                "Please enter a mark from 0–8 in all four criteria.";

            resultWrapper.classList.remove("show");

            return;

        }


        /* Convert to numbers */

        const numbers = values.map(Number);


        /* Validate */

        const valid = numbers.every(number => {

            return Number.isInteger(number) &&
                   number >= 0 &&
                   number <= 8;

        });


        if(!valid){

            errorMessage.textContent =
                "Each criterion must be a whole number from 0–8.";

            resultWrapper.classList.remove("show");

            return;

        }


        /* Calculate total */

        const total =
            numbers[0] +
            numbers[1] +
            numbers[2] +
            numbers[3];


        /* Calculate final grade */

        const finalGrade =
            getFinalGrade(total);


        /* Display result */

        resultScore.textContent = finalGrade;

        resultMessage.textContent =
            `You scored ${total}/32 across Criteria A–D.`;


        /* Restart animation */

        resultWrapper.classList.remove("show");

        void resultWrapper.offsetWidth;

        resultWrapper.classList.add("show");


        /* Scroll to result */

        setTimeout(() => {

            resultWrapper.scrollIntoView({
                behavior:"smooth",
                block:"center"
            });

        }, 100);

    });

</script>

</body>
</html>
